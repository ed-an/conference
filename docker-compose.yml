services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conference
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference -d conference"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - conference-postgres:/var/lib/postgresql/data

volumes:
  conference-postgres:
